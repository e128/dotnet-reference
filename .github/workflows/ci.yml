name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: Format + Build + Test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Format check
        run: dotnet format E128.Reference.slnx --verify-no-changes

      - name: Build (Release)
        run: dotnet build E128.Reference.slnx --configuration Release -clp:ErrorsOnly

      # Coverage collects in Debug. The Release build still validates Release
      # compilation, and the in-process coverage extension avoids the
      # ReadyToRun images that stall the analyzer test host.
      - name: Build (Debug, coverage)
        run: dotnet build E128.Reference.slnx --configuration Debug -clp:ErrorsOnly

      - name: Install xmllint
        run: command -v xmllint >/dev/null || (sudo apt-get update && sudo apt-get install -y libxml2-utils)

      - name: Test
        run: |
          dotnet test --solution E128.Reference.slnx \
            --configuration Debug \
            --no-build \
            --filter-trait "Category=CI" \
            --coverage \
            --coverage-output-format cobertura \
            --coverage-settings coverage.config.xml \
            --results-directory ./test-results

      - name: "Gate: Coverage"
        run: bash scripts/coverage-areas.sh --min-line 80 --min-assembly 80

      - name: "Upload: Coverage"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: ./test-results/
          retention-days: 7

      - name: "Report: Coverage Summary"
        if: always()
        continue-on-error: true
        run: bash scripts/coverage-areas.sh --markdown >> "$GITHUB_STEP_SUMMARY"

  shellcheck:
    name: Shell Lint
    runs-on: ubuntu-26.04
    env:
      SHELLCHECK_VERSION: 0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: |
          curl -fsSL -o shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          sudo install "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck

      - name: Lint shell scripts
        run: bash scripts/lint-shell.sh

  harness:
    name: Agent Mirror Check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check opencode agent mirror
        run: bash scripts/internal/opencode-agents.sh check

      - name: Check guardrail plugin hook references
        run: |
          set -euo pipefail
          missing=0
          while read -r hook; do
            if [ ! -f ".claude/hooks/$hook" ]; then
              echo "Missing hook: .claude/hooks/$hook"
              missing=1
            fi
          done < <(grep -oE '"[a-z][a-z0-9-]*"' .opencode/plugins/e128-guardrails/index.ts \
            | tr -d '"' | grep -E '^(block-|pre-|post-|init-|validate-|stop-|user-)' | sort -u)
          exit "$missing"

  secrets:
    name: Secret Scan
    runs-on: ubuntu-26.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks

      - name: Scan history
        run: ./gitleaks git --no-banner --redact --exit-code 1
